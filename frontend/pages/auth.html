<div class="auth-wrapper">
    <div class="auth-box">
        <h2 id="auth-title">Rejoignez X / twitter </h2>
        
        <form id="auth-form">
            <input type="text" id="auth-username" placeholder="Nom d'utilisateur" required>
            <input type="password" id="auth-password" placeholder="Mot de passe" required>
            
            <button type="submit" class="btn-primary" id="auth-submit">S'inscrire</button>
        </form>
        
        <p class="auth-switch">
            Déjà un compte ? <span id="toggle-auth">Se connecter</span>
        </p>
    </div>
</div>
