<div class="home-feed">
    <header class="feed-header">
        <h2>Accueil</h2>
    </header>
    <div class="compose-tweet" style="display: flex !important; flex-direction: row !important; align-items: flex-start !important; flex-wrap: nowrap !important; gap: 12px; padding: 16px; border-bottom: 1px solid var(--border-color, #2f3336); width: 100%; box-sizing: border-box;">
    
        <div style="flex: 0 0 48px; width: 48px; height: 48px; cursor: pointer;">
            <img id="compose-avatar" src="https://abs.twimg.com/sticky/default_profile_images/default_profile_normal.png" alt="Moi" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
        </div>
        
        <div style="flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0;">
            <textarea placeholder="Quoi de neuf ?!" style="width: 100%; border: none; background: transparent; color: var(--text-main, white); font-size: 1.2rem; outline: none; resize: none; min-height: 60px; font-family: inherit; margin-bottom: 10px;"></textarea>
            
            <div style="display: flex; justify-content: flex-end; border-top: 1px solid var(--border-color, #2f3336); padding-top: 12px;">
                <button id="btn-post" style="padding: 8px 18px; border-radius: 9999px; background-color: #1d9bf0; color: white; font-weight: bold; border: none; cursor: pointer; font-size: 0.95rem; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='#1a8cd8'" onmouseout="this.style.backgroundColor='#1d9bf0'">Poster</button>
            </div>
        </div>
    </div>
    <div id="tweets-container">
        </div>
</div>
