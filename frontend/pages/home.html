<div class="home-feed">
    <header class="feed-header">
        <h2>Accueil</h2>
        <div id="home-feed-tabs" style="display: flex; border-top: 1px solid var(--border-color); margin-top: 12px;">
            <button
                id="tab-for-you"
                class="home-feed-tab active"
                data-feed="for-you"
                style="flex: 1; padding: 14px 10px; background: transparent; color: white; border: none; border-bottom: 2px solid #1d9bf0; font-weight: bold; cursor: pointer;"
            >
                Pour vous
            </button>
            <button
                id="tab-following"
                class="home-feed-tab"
                data-feed="following"
                style="flex: 1; padding: 14px 10px; background: transparent; color: var(--text-muted); border: none; border-bottom: 2px solid transparent; font-weight: bold; cursor: pointer;"
            >
                Abonnements
            </button>
        </div>
    </header>
    <div class="compose-tweet" style="display: flex; gap: 12px; padding: 16px; border-bottom: 1px solid var(--border-color); width: 100%; box-sizing: border-box;">
    
        <div style="flex: 0 0 48px;">
            <img id="compose-avatar" src="https://abs.twimg.com/sticky/default_profile_images/default_profile_normal.png" style="width: 48px; height: 48px; border-radius: 50%; object-fit: cover;">
        </div>
        
        <div style="flex: 1; display: flex; flex-direction: column; min-width: 0;">
            <textarea placeholder="Quoi de neuf ?!" style="width: 100%; border: none; background: transparent; color: white; font-size: 1.2rem; outline: none; resize: none; min-height: 50px; font-family: inherit;"></textarea>
            
            <div id="image-preview-container" style="display: none; position: relative; margin: 10px 0;">
                <img id="image-preview" src="" style="width: 100%; max-height: 300px; border-radius: 16px; object-fit: cover; border: 1px solid #2f3336;">
                <button id="remove-preview" style="position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); color: white; border: none; border-radius: 50%; width: 25px; height: 25px; cursor: pointer;">✕</button>
            </div>
    
            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #2f3336; padding-top: 12px;">
                <div style="display: flex; gap: 10px;">
                    <input type="file" id="input-tweet-image" accept="image/*" style="display: none;">
                    <button id="btn-upload-img" style="background: none; border: none; cursor: pointer; color: #1d9bf0; display: flex; align-items: center; justify-content: center; padding: 8px; border-radius: 50%; transition: 0.2s;" onmouseover="this.style.backgroundColor='rgba(29,155,240,0.1)'" onmouseout="this.style.backgroundColor='transparent'">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 5.5C3 4.119 4.119 3 5.5 3h13C19.881 3 21 4.119 21 5.5v13c0 1.381-1.119 2.5-2.5 2.5h-13C4.119 21 3 19.881 3 18.5v-13zM5.5 5c-.276 0-.5.224-.5.5v9.086l3-3 3 3 5-5 3 3V5.5c0-.276-.224-.5-.5-.5h-13zM9.75 7C8.784 7 8 7.784 8 8.75s.784 1.75 1.75 1.75 1.75-.784 1.75-1.75S10.716 7 9.75 7z"></path></svg>
                    </button>
                </div>
    
                <button id="btn-post" style="padding: 8px 18px; border-radius: 9999px; background-color: #1d9bf0; color: white; font-weight: bold; border: none; cursor: pointer;">Poster</button>
            </div>
        </div>
    </div>
    <div id="tweets-container">
        </div>
</div>
