<div class="home-feed">
    <header class="feed-header">
        <h2>Accueil</h2>
    </header>

    <div class="compose-tweet">
        <input id="author-input" type="text" maxlength="50" placeholder="Votre nom">
        <textarea id="content-input" maxlength="280" placeholder="Quoi de neuf ?"></textarea>
        <div class="compose-actions">
            <span id="char-count">0 / 280</span>
            <button id="btn-post">Publier</button>
        </div>
    </div>

    <div id="tweets-container"></div>
</div>
