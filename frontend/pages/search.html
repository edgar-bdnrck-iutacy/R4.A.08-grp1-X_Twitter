<div class="search-view">
    <header class="feed-header" style="position: sticky; top: 0; background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(12px); z-index: 20; padding: 10px 15px; border-bottom: 1px solid var(--border-color);">
        <input type="text" id="search-page-input" placeholder="Chercher des utilisateurs..." 
               style="width: 100%; padding: 12px 20px; border-radius: 9999px; background: #202327; border: 1px solid transparent; color: white; outline: none; font-size: 1rem; transition: background 0.2s;"
               onfocus="this.style.background='black'; this.style.border='1px solid var(--twitter-blue)'"
               onblur="this.style.background='#202327'; this.style.border='1px solid transparent'">
    </header>
    
    <div id="search-page-results">
        <p style="text-align: center; color: var(--text-muted); padding: 40px;">
            Tapez un nom ou un @pseudo pour commencer la recherche.
        </p>
    </div>
</div>
