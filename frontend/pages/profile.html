<div class="profile-view">
    <header class="profile-header-nav">
        <h2 id="profile-name">Chargement...</h2>
    </header>
    
    <div class="profile-banner"></div>

    <div class="profile-details">
        <div class="avatar-placeholder"></div>
        <div class="profile-info">
            <h3 id="profile-name-text">Nom complet</h3> 
            <p id="profile-handle">@handle</p>
            <p id="profile-bio">Biographie de l'utilisateur</p>
        </div>
    </div>

    <div class="profile-tabs">
        <button class="active">Posts</button>
        <button>Réponses</button>
        <button>J'aime</button>
    </div>

    <div id="user-tweets-container"></div>
</div>
